[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/alloy-luau/ingots"

[workspace.dependencies]
# The guest crate lives in the compiler repository, checked out beside
# this one; a release pins the crates.io version instead.
alloy-ingot = { path = "../crates/crates/alloy-ingot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
all = "warn"

